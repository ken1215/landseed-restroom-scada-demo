<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯新國際醫院｜公共廁所通報 SCADA 監控（S1F 示範）</title>
<style>
:root{
  --bg:#0d1620; --panel:#132131; --panel2:#182a3d; --line:#25405a; --ink:#d8e4ee; --mute:#7f97ad;
  --ok:#2ecc71; --warn:#f5b301; --alarm:#ff4d4f; --clean:#3aa0ff; --off:#6b7c8c; --brand:#008CD6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"微軟正黑體","Microsoft JhengHei","PingFang TC",sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#0a121a;border-bottom:1px solid var(--line)}
header .brand{display:flex;flex-direction:column;line-height:1.25}
header .brand b{font-size:16px;letter-spacing:.5px}
header .brand span{font-size:12px;color:var(--mute)}
header .sep{width:1px;height:34px;background:var(--line)}
header .title{font-size:18px;font-weight:700}
header .demo{margin-left:6px;padding:2px 8px;border:1px solid var(--warn);color:var(--warn);border-radius:3px;font-size:12px}
header .right{margin-left:auto;display:flex;align-items:center;gap:14px}
#clock{font-variant-numeric:tabular-nums;font-size:16px;color:#fff}
.sim{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;cursor:pointer;user-select:none}
.sim input{accent-color:var(--brand)}
.wrap{display:grid;grid-template-columns:220px 1fr 340px;gap:12px;padding:12px 14px;height:calc(100vh - 57px)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.panel h3{margin:0;padding:9px 12px;font-size:13px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);letter-spacing:.5px}
/* 左欄：棟別樓層樹 */
.tree{overflow:auto;padding:6px 0}
.tree .bld{padding:8px 12px 4px;color:var(--mute);font-size:12px}
.tree .fl{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 6px 20px;cursor:default;color:#9fb3c6}
.tree .fl.on{background:var(--panel2);color:#fff;border-left:3px solid var(--brand);padding-left:17px;cursor:pointer}
.tree .fl.off{opacity:.45}
.tree .fl small{font-size:11px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok)}
/* 中欄 */
.center{display:grid;grid-template-rows:auto 1fr auto;gap:12px;min-height:0}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--mute);margin-top:2px}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.alarm .v{color:var(--alarm)} .kpi.clean .v{color:var(--clean)}
.views{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;min-height:0}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:8px}
.plan{position:relative;max-width:100%;max-height:100%;aspect-ratio:var(--ar)}
.plan img{width:100%;height:100%;display:block;filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(1.1);opacity:.9}
.zone{position:absolute;border:2px solid var(--ok);background:rgba(46,204,113,.12);border-radius:3px;cursor:pointer}
.zone .tag{position:absolute;left:0;top:-22px;white-space:nowrap;background:#0a121a;border:1px solid currentColor;padding:1px 6px;font-size:11px;border-radius:3px}
.pt{position:absolute;transform:translate(-50%,-50%);min-width:44px;height:22px;padding:0 5px;border-radius:11px;border:2px solid var(--ok);background:rgba(10,18,26,.88);
    color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.pt.sel{outline:2px solid #fff;outline-offset:2px}
.s-ok{border-color:var(--ok)!important;color:var(--ok)}
.s-warn{border-color:var(--warn)!important;color:var(--warn)}
.s-alarm{border-color:var(--alarm)!important;color:var(--alarm);animation:blink 1s steps(2,start) infinite}
.s-clean{border-color:var(--clean)!important;color:var(--clean)}
.s-off{border-color:var(--off)!important;color:var(--off);border-style:dashed!important}
.pt.s-ok,.pt.s-warn,.pt.s-alarm,.pt.s-clean,.pt.s-off{color:#fff}
.pt.s-ok{background:rgba(46,204,113,.25)} .pt.s-warn{background:rgba(245,179,1,.3)} .pt.s-alarm{background:rgba(255,77,79,.45)}
.pt.s-clean{background:rgba(58,160,255,.3)} .pt.s-off{background:rgba(107,124,140,.25)}
.zone.s-warn{background:rgba(245,179,1,.15)} .zone.s-alarm{background:rgba(255,77,79,.18)} .zone.s-clean{background:rgba(58,160,255,.15)}
@keyframes blink{to{opacity:.35}}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* 事件 */
.events{height:180px}
.events .list{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:5px 10px;text-align:left;border-bottom:1px solid #1d3247;white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.code{font-weight:700;font-variant-numeric:tabular-nums}
.badge{padding:1px 7px;border-radius:9px;font-size:11.5px;border:1px solid currentColor}
/* 右欄 */
.detail{padding:12px;overflow:auto;flex:1}
.detail .code{font-size:26px;font-weight:800;letter-spacing:.5px}
.detail .type{color:var(--mute);margin-bottom:10px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:6px 8px;font-size:13px;margin:10px 0}
.kv div:nth-child(odd){color:var(--mute)}
.btns{display:flex;gap:8px;margin:12px 0}
button{flex:1;padding:8px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-family:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--brand)}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.note{font-size:12px;color:var(--warn);background:rgba(245,179,1,.08);border:1px solid rgba(245,179,1,.35);padding:7px 9px;border-radius:4px;margin-top:8px}
.qr{font-size:12px;color:var(--mute);word-break:break-all;margin-top:10px}
.qr a{color:var(--brand)}
.hist{margin-top:12px}
.hist div{font-size:12px;padding:4px 0;border-bottom:1px dashed #1d3247;color:#a9bccd}
footer{position:fixed;right:16px;bottom:6px;font-size:11px;color:var(--mute)}
</style>
</head>

  {c:"S1-FT04",t:"女廁",g:"女廁",x:83.9,y:59.5,note:"洗手台右側獨立小間（圖面紅色標示，疑兒童用或新增）"},
  {c:"S1-A01",t:"無障礙廁所",g:"無障礙",x:21.5,y:91.5,note:"清冊註記：與 S1-A02 同一間"},
  {c:"S1-A02",t:"無障礙廁所",g:"無障礙",x:33.5,y:91.5,note:"清冊註記：與 S1-A01 同一間"},
];
// 全層圖上的廁所區框（百分比）
const ZONE = {x:56.3,y:52.1,w:10.9,h:11.7};

const now = () => new Date();
const hhmm = d => d.toTimeString().slice(0,5);
const hhmmss = d => d.toTimeString().slice(0,8);
const STATUS = {ok:"正常",warn:"已通報",alarm:"逾時",clean:"清潔中",off:"待確認"};
const ISSUES = ["地面濕滑","衛生紙用完","馬桶堵塞","異味","垃圾桶滿","洗手乳用完","沖水故障"];
const events = []; const done = [];

// 初始狀態
P.forEach((p,i)=>{
  p.s = p.off ? "off" : "ok";
  p.last = new Date(Date.now() - (20 + i*7) * 60000);
  p.hist = [];
});
function setState(p, s, issue){
  p.s = s; const t = now();
  if (s === "warn"){ p.since = t; p.issue = issue; p.hist.unshift(`${hhmm(t)}　通報：${issue}`); log(p,`通報：${issue}`,s); }
  if (s === "clean"){ p.hist.unshift(`${hhmm(t)}　清潔人員到場`); log(p,"清潔人員到場","clean"); }
  if (s === "ok"){
    if (p.since){ done.push((t - p.since)/60000); }
    p.last = t; p.since = null; p.issue = null; p.hist.unshift(`${hhmm(t)}　處理完成`); log(p,"處理完成","ok");
  }
  if (s === "alarm"){ p.hist.unshift(`${hhmm(t)}　逾時未處理，已再推播 LINE 群組`); log(p,"逾時，已再推播 LINE 群組","alarm"); }
  render();
}
function log(p, msg, s){
  events.unshift({t:hhmmss(now()), c:p.c, g:p.g, msg, s});
  if (events.length > 60) events.pop();
}

// 左欄樹
const TREE = {
  "門診大樓 S":["12F","11F","10F","9F","5F","3F","2F","1F","B1","B2","B3"],
  "連通區 SL":["B2"],
  "醫療大樓 L":["12F","11F","3F","1F","B1"],
  "透析大樓 D":["7F","6F","5F","3F","2F","1F"],
};
function renderTree(){
  const el = document.getElementById("tree"); let h = "";
  for (const [b, fls] of Object.entries(TREE)){
    h += `<div class="bld">${b}</div>`;
    fls.forEach(f=>{
      const on = b.startsWith("門診") && f === "1F";
      if (on){
        const worst = worstState();
        h += `<div class="fl on"><span>${f}　<small>${P.filter(p=>!p.off).length} 點</small></span><span class="dot" style="background:var(--${worst})"></span></div>`;
      } else h += `<div class="fl off"><span>${f}</span><small>建置中</small></div>`;
    });
  }
  el.innerHTML = h;
}
function worstState(){
  const live = P.filter(p=>!p.off).map(p=>p.s);
  return live.includes("alarm") ? "alarm" : live.includes("warn") ? "warn" : live.includes("clean") ? "clean" : "ok";
}

let sel = null;
function render(){
  // 細部點位
  const wc = document.getElementById("planWc");
  wc.querySelectorAll(".pt").forEach(e=>e.remove());
  P.forEach(p=>{
    const d = document.createElement("div");
    d.className = `pt s-${p.s}` + (sel === p ? " sel" : "");
    d.style.left = p.x + "%"; d.style.top = p.y + "%";
    d.textContent = p.c.replace("S1-","").replace("待編 ","?");
    d.title = `${p.c}　${STATUS[p.s]}`;
    d.onclick = () => { sel = p; render(); };
    wc.appendChild(d);
  });
  // 全層區塊
  const full = document.getElementById("planFull");
  full.querySelectorAll(".zone").forEach(e=>e.remove());
  const z = document.createElement("div"); const w = worstState();
  z.className = `zone s-${w}`;
  Object.assign(z.style,{left:ZONE.x+"%",top:ZONE.y+"%",width:ZONE.w+"%",height:ZONE.h+"%",borderColor:`var(--${w})`,color:`var(--${w})`});
  const n = P.filter(p=>p.s==="warn"||p.s==="alarm").length;
  z.innerHTML = `<span class="tag">S1-R01　${n ? n + " 點待處理" : "正常"}</span>`;
  full.appendChild(z);
  // KPI
  const live = P.filter(p=>!p.off);
  const c = s => live.filter(p=>p.s===s).length;
  k_all.textContent = live.length; k_ok.textContent = c("ok"); k_warn.textContent = c("warn");
  k_alarm.textContent = c("alarm"); k_clean.textContent = c("clean");
  k_avg.textContent = done.length ? (done.reduce((a,b)=>a+b,0)/done.length).toFixed(1) : "--";
  // 事件
  document.getElementById("ev").innerHTML = events.map(e=>
    `<tr><td>${e.t}</td><td class="code">${e.c}</td><td>${e.g}</td><td>${e.msg}</td><td><span class="badge s-${e.s}">${STATUS[e.s]}</span></td></tr>`).join("");
  renderTree(); renderDetail();
}
function renderDetail(){
  const el = document.getElementById("detail");
  if (!sel){ el.innerHTML = '<div style="color:var(--mute)">點選平面圖上的點位查看詳情</div>'; return; }
  const p = sel; const wait = p.since ? Math.floor((now()-p.since)/60000) + " 分鐘" : "—";
  el.innerHTML = `
    <div class="code">${p.c}</div>
    <div class="type">${p.t}</div>
    <span class="badge s-${p.s}">${STATUS[p.s]}</span>
    <div class="kv">
      <div>棟別樓層</div><div>門診大樓 1F</div>
      <div>位置</div><div>${LOC}・${p.g}</div>
      <div>廁所主編碼</div><div>S1-R01${p.g==="男廁"?"M":p.g==="女廁"?"W":"A"}</div>
      <div>責任區</div><div>門診門診層（1～3F）</div>
      <div>通報內容</div><div>${p.issue || "—"}</div>
      <div>等待時間</div><div>${wait}</div>
      <div>上次清潔</div><div>${hhmm(p.last)}</div>
    </div>
    ${p.note ? `<div class="note">${p.note}</div>` : ""}
    ${p.off ? "" : `<div class="btns">
      <button onclick="act('warn')">模擬通報</button>
      <button onclick="act('clean')">到場清潔</button>
      <button class="primary" onclick="act('ok')">處理完成</button></div>`}
    ${p.off ? "" : `<div class="qr">QR 通報網址<br><a href="${BASE + p.c}" target="_blank" rel="noopener">${BASE + p.c}</a></div>`}
    <div class="hist"><div style="color:var(--mute)">今日紀錄</div>${p.hist.slice(0,8).map(h=>`<div>${h}</div>`).join("") || "<div>—</div>"}</div>`;
}
function act(s){ if (!sel || sel.off) return; setState(sel, s, s==="warn" ? ISSUES[Math.floor(Math.random()*ISSUES.length)] : null); }

// 模擬引擎：隨機通報、到場、完成；已通報超過 15 分（模擬時間加速：1 秒＝1 分）轉逾時
const SPEED = 60; // 模擬倍率
let simMin = 0;
setInterval(()=>{
  clock.textContent = hhmmss(now());
  if (!simOn.checked) { if (sel) renderDetail(); return; }
  simMin++;
  const live = P.filter(p=>!p.off);
  live.forEach(p=>{
    if (p.s === "warn"){
      p.wsim = (p.wsim||0) + 1;
      if (p.wsim > 15) { p.wsim = 0; setState(p,"alarm"); }
      else if (Math.random() < .12) { p.wsim = 0; setState(p,"clean"); }
    } else if (p.s === "alarm"){ if (Math.random() < .15) setState(p,"clean"); }
    else if (p.s === "clean"){ if (Math.random() < .3) setState(p,"ok"); }
  });
  const okp = live.filter(p=>p.s==="ok");
  if (okp.length && Math.random() < .08){ const p = okp[Math.floor(Math.random()*okp.length)]; setState(p,"warn",ISSUES[Math.floor(Math.random()*ISSUES.length)]); }
  if (sel) renderDetail();
}, 1000);

// 開場預置幾筆狀態，畫面一打開就有內容
setState(P[5],"warn","衛生紙用完");
setState(P[9],"warn","地面濕滑"); P[9].wsim = 14;
setState(P[1],"clean");
setState(P[1],"ok");
sel = P[5]; render();
</script>
</body>
